<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#818cf8" />
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="540" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="460" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    🏛️ Layered Network Models: OSI (7-Layer) vs. TCP/IP (5-Layer)
  </text>
  <text x="460" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">
    Conceptual reference abstraction mapped to real-world Internet protocol stack and PDUs
  </text>

  <!-- Column Headers -->
  <rect x="50" y="80" width="260" height="34" rx="8" fill="#6366f125" stroke="#6366f1" stroke-width="1.2"/>
  <text x="180" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc">
    OSI 7-LAYER REFERENCE MODEL
  </text>

  <rect x="350" y="80" width="280" height="34" rx="8" fill="#10b98125" stroke="#10b981" stroke-width="1.2"/>
  <text x="490" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">
    TCP/IP 5-LAYER INTERNET STACK
  </text>

  <rect x="670" y="80" width="200" height="34" rx="8" fill="#f59e0b25" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="770" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fcd34d">
    PDU &amp; PROTOCOLS
  </text>

  <!-- Group: App Scope (OSI 7, 6, 5 -> TCP/IP 5) -->
  <!-- OSI 7 -->
  <rect x="50" y="125" width="260" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" filter="url(#shadow)"/>
  <text x="65" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">7. Application</text>
  <text x="295" y="151" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">UI / Network API</text>

  <!-- OSI 6 -->
  <rect x="50" y="172" width="260" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" filter="url(#shadow)"/>
  <text x="65" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">6. Presentation</text>
  <text x="295" y="198" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">TLS / Compression</text>

  <!-- OSI 5 -->
  <rect x="50" y="219" width="260" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" filter="url(#shadow)"/>
  <text x="65" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">5. Session</text>
  <text x="295" y="245" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Sync / Checkpoints</text>

  <!-- Connector from OSI 7,6,5 to TCP/IP 5 -->
  <path d="M 310 193 L 350 193" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)" />

  <!-- TCP/IP 5: Application -->
  <rect x="350" y="125" width="280" height="136" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="365" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">5. Application Layer</text>
  <text x="365" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">Consolidates App, TLS, Compression,</text>
  <text x="365" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">&amp; Session management directly in user space</text>
  <rect x="365" y="210" width="250" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="490" y="233" text-anchor="middle" font-family="monospace" font-size="11" fill="#7dd3fc">HTTP • HTTPS • DNS • SSH • SMTP</text>

  <!-- PDU 5 -->
  <rect x="670" y="125" width="200" height="136" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="770" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">📄 DATA / MESSAGE</text>
  <text x="770" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Raw user payload +</text>
  <text x="770" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Application headers</text>
  <text x="770" y="235" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">Scope: Host Process</text>

  <!-- Layer 4: Transport -->
  <rect x="50" y="275" width="260" height="52" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="65" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc">4. Transport Layer</text>
  <text x="295" y="305" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">End-to-End Reliability</text>

  <path d="M 310 301 L 350 301" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)" />

  <rect x="350" y="275" width="280" height="52" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="365" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a5b4fc">4. Transport (TCP / UDP)</text>
  <text x="365" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Process-to-process multiplexing via Ports</text>

  <rect x="670" y="275" width="200" height="52" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="770" y="297" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#c7d2fe">📦 SEGMENT / DATAGRAM</text>
  <text x="770" y="316" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">Port # • Seq # • Checksum</text>

  <!-- Layer 3: Network -->
  <rect x="50" y="338" width="260" height="52" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="65" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#d8b4fe">3. Network Layer</text>
  <text x="295" y="368" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Global Routing</text>

  <path d="M 310 364 L 350 364" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)" />

  <rect x="350" y="338" width="280" height="52" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="365" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#d8b4fe">3. Network (IPv4 / IPv6)</text>
  <text x="365" y="379" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Host-to-host packet routing across routers</text>

  <rect x="670" y="338" width="200" height="52" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="770" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e9d5ff">✉️ PACKET (IP Datagram)</text>
  <text x="770" y="379" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">Source IP • Dest IP • TTL</text>

  <!-- Layer 2: Data Link -->
  <rect x="50" y="401" width="260" height="52" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="65" y="431" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#6ee7b7">2. Data Link Layer</text>
  <text x="295" y="431" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Hop-by-Hop Framing</text>

  <path d="M 310 427 L 350 427" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)" />

  <rect x="350" y="401" width="280" height="52" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="365" y="423" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#6ee7b7">2. Data Link (Ethernet / Wi-Fi)</text>
  <text x="365" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Hop delivery via MAC addresses across switches</text>

  <rect x="670" y="401" width="200" height="52" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="770" y="423" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">🖼️ FRAME</text>
  <text x="770" y="442" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">MAC Header • Data • FCS</text>

  <!-- Layer 1: Physical -->
  <rect x="50" y="464" width="260" height="52" rx="6" fill="#1e293b" stroke="#fb923c" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="65" y="494" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#fdba74">1. Physical Layer</text>
  <text x="295" y="494" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Signals &amp; Medium</text>

  <path d="M 310 490 L 350 490" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)" />

  <rect x="350" y="464" width="280" height="52" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="365" y="486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fdba74">1. Physical (Copper / Fiber / Air)</text>
  <text x="365" y="505" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Raw bitstream transmission &amp; signal encoding</text>

  <rect x="670" y="464" width="200" height="52" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="770" y="486" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fed7aa">⚡ BITS</text>
  <text x="770" y="505" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">01101001 01101110 01110100...</text>

  <!-- DrawIO metadata script -->
  <script type="application/xml">
    <mxfile host="Electron" modified="2026-10-06T11:00:00.000Z" agent="Antigravity" version="21.6.8" type="device">
      <diagram id="osi-vs-tcpip" name="OSI vs TCP-IP Architecture">
        <mxGraphModel dx="1000" dy="600" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="920" pageHeight="540" background="#0f172a">
          <root>
            <mxCell id="0"/>
            <mxCell id="1" parent="0"/>
          </root>
        </mxGraphModel>
      </diagram>
    </mxfile>
  </script>
</svg>
