<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="920px" height="520px" viewBox="-0.5 -0.5 920 520" content="&lt;mxfile host=&quot;Electron&quot; agent=&quot;Mozilla/5.0 (Windows NT 10.0; Win64; x64)&quot; version=&quot;21.6.8&quot;&gt;&lt;diagram id=&quot;tree-recursion&quot; name=&quot;Tree Recursion Decomposition&quot;&gt;&lt;mxGraphModel dx=&quot;920&quot; dy=&quot;520&quot; grid=&quot;1&quot; gridSize=&quot;10&quot; guides=&quot;1&quot; tooltips=&quot;1&quot; connect=&quot;1&quot; arrows=&quot;1&quot; fold=&quot;1&quot; page=&quot;1&quot; pageScale=&quot;1&quot; pageWidth=&quot;920&quot; pageHeight=&quot;520&quot; math=&quot;0&quot; shadow=&quot;0&quot;&gt;&lt;root&gt;&lt;mxCell id=&quot;0&quot;/&gt;&lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="strokeWidth" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
    </marker>
  </defs>

  <!-- Background Card -->
  <rect x="0" y="0" width="920" height="520" rx="16" fill="url(#bgGrad2)" stroke="#374151" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="35" y="42" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">
    🌳 Why Recursion is Naturally Tailored for Binary Trees
  </text>
  <text x="35" y="65" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">
    Self-Similarity: Every node processes its local state and delegates subtrees to recursive sub-calls
  </text>

  <!-- Left: Tree Visual Decomposition -->
  <g transform="translate(35, 95)">
    <rect x="0" y="0" width="410" height="395" rx="12" fill="#1e1e2e" fill-opacity="0.5" stroke="#4b5563" stroke-width="1.2"/>
    <text x="205" y="30" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      1. Structural Tree Decomposition
    </text>

    <!-- Root Node 1 -->
    <rect x="165" y="55" width="80" height="42" rx="8" fill="#be185d" fill-opacity="0.8" stroke="#f472b6" stroke-width="2"/>
    <text x="205" y="80" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Node 1</text>

    <!-- Left Subtree Cluster -->
    <rect x="20" y="130" width="165" height="175" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="102" y="152" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Left Subtree</text>

    <!-- Node 2 -->
    <rect x="65" y="165" width="75" height="38" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="102" y="189" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Node 2</text>

    <!-- Node 4 & 5 -->
    <rect x="30" y="240" width="65" height="35" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="62" y="262" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Node 4</text>

    <rect x="110" y="240" width="65" height="35" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="142" y="262" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Node 5</text>

    <!-- Right Subtree Cluster -->
    <rect x="225" y="130" width="165" height="175" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="307" y="152" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Right Subtree</text>

    <!-- Node 3 -->
    <rect x="270" y="165" width="75" height="38" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="307" y="189" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Node 3</text>

    <!-- Connectors -->
    <line x1="185" y1="97" x2="102" y2="165" stroke="#818cf8" stroke-width="2"/>
    <line x1="225" y1="97" x2="307" y2="165" stroke="#818cf8" stroke-width="2"/>
    <line x1="90" y1="203" x2="62" y2="240" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="115" y1="203" x2="142" y2="240" stroke="#818cf8" stroke-width="1.5"/>

    <!-- Bottom summary label -->
    <rect x="20" y="325" width="370" height="45" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
    <text x="205" y="352" fill="#c7d2fe" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      "I process root (1), recursion solves subtrees (2 &amp; 3)"
    </text>
  </g>

  <!-- Right: Code Execution Timeline & Traversal Alignment -->
  <g transform="translate(475, 95)">
    <rect x="0" y="0" width="410" height="395" rx="12" fill="#111827" stroke="#4b5563" stroke-width="1.2"/>
    <text x="205" y="30" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      2. Code Flow &amp; Traversal Timing
    </text>

    <!-- Preorder Block -->
    <rect x="20" y="55" width="370" height="90" rx="8" fill="#1f2937" stroke="#ec4899" stroke-width="1.5"/>
    <text x="35" y="80" fill="#f472b6" font-family="sans-serif" font-size="12" font-weight="bold">PREORDER (Root First):</text>
    <text x="35" y="102" fill="#e5e7eb" font-family="monospace" font-size="11">System.out.println(root.data); // 1. ROOT</text>
    <text x="35" y="120" fill="#9ca3af" font-family="monospace" font-size="11">traverse(root.left);           // 2. LEFT</text>
    <text x="35" y="138" fill="#9ca3af" font-family="monospace" font-size="11">traverse(root.right);          // 3. RIGHT</text>

    <!-- Inorder Block -->
    <rect x="20" y="160" width="370" height="90" rx="8" fill="#1f2937" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="35" y="185" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">INORDER (Root Middle):</text>
    <text x="35" y="207" fill="#9ca3af" font-family="monospace" font-size="11">traverse(root.left);           // 1. LEFT</text>
    <text x="35" y="225" fill="#e5e7eb" font-family="monospace" font-size="11">System.out.println(root.data); // 2. ROOT</text>
    <text x="35" y="243" fill="#9ca3af" font-family="monospace" font-size="11">traverse(root.right);          // 3. RIGHT</text>

    <!-- Postorder Block -->
    <rect x="20" y="265" width="370" height="90" rx="8" fill="#1f2937" stroke="#10b981" stroke-width="1.5"/>
    <text x="35" y="290" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">POSTORDER (Root Last):</text>
    <text x="35" y="312" fill="#9ca3af" font-family="monospace" font-size="11">traverse(root.left);           // 1. LEFT</text>
    <text x="35" y="330" fill="#9ca3af" font-family="monospace" font-size="11">traverse(root.right);          // 2. RIGHT</text>
    <text x="35" y="348" fill="#e5e7eb" font-family="monospace" font-size="11">System.out.println(root.data); // 3. ROOT</text>

    <text x="205" y="380" fill="#fbbf24" font-family="sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">
      ⚡ Moving the ROOT line changes the entire traversal!
    </text>
  </g>
</svg>
