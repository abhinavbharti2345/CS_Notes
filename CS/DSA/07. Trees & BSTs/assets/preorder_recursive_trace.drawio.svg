<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="940px" height="540px" viewBox="-0.5 -0.5 940 540" content="&lt;mxfile host=&quot;Electron&quot; agent=&quot;Mozilla/5.0 (Windows NT 10.0; Win64; x64)&quot; version=&quot;21.6.8&quot;&gt;&lt;diagram id=&quot;preorder-trace&quot; name=&quot;Preorder Recursive Trace&quot;&gt;&lt;mxGraphModel dx=&quot;940&quot; dy=&quot;540&quot; grid=&quot;1&quot; gridSize=&quot;10&quot; guides=&quot;1&quot; tooltips=&quot;1&quot; connect=&quot;1&quot; arrows=&quot;1&quot; fold=&quot;1&quot; page=&quot;1&quot; pageScale=&quot;1&quot; pageWidth=&quot;940&quot; pageHeight=&quot;540&quot; math=&quot;0&quot; shadow=&quot;0&quot;&gt;&lt;root&gt;&lt;mxCell id=&quot;0&quot;/&gt;&lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <defs>
    <linearGradient id="traceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrowMagenta" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="strokeWidth" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ec4899"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="strokeWidth" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#06b6d4"/>
    </marker>
  </defs>

  <!-- Card Background -->
  <rect x="0" y="0" width="940" height="540" rx="16" fill="url(#traceBg)" stroke="#374151" stroke-width="1.5"/>

  <!-- Header -->
  <text x="35" y="40" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">
    🌲 Step-by-Step Recursive Preorder Traversal Trace: preorder(1)
  </text>
  <text x="35" y="63" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">
    The Subtree Delegation Mental Model: "Process Root ➔ Solve Entire Left Subtree ➔ Return ➔ Solve Right Subtree"
  </text>

  <!-- Left: Tree Flow with Call/Return Trajectories -->
  <g transform="translate(35, 90)">
    <rect x="0" y="0" width="420" height="420" rx="12" fill="#1e1e2e" fill-opacity="0.6" stroke="#4b5563" stroke-width="1.2"/>
    <text x="210" y="28" fill="#f472b6" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      Tree Call &amp; Backtrack Journey
    </text>

    <!-- Node 1 (Root) -->
    <circle cx="210" cy="70" r="26" fill="#be185d" stroke="#f472b6" stroke-width="2.5"/>
    <text x="210" y="76" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">1</text>
    <text x="210" y="38" fill="#fbcfe8" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Step 1 (Print 1)</text>

    <!-- Node 2 -->
    <circle cx="110" cy="170" r="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="110" y="176" fill="#ffffff" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">2</text>
    <text x="60" y="150" fill="#bae6fd" font-family="sans-serif" font-size="10" font-weight="bold">Step 2 (Print 2)</text>

    <!-- Node 3 -->
    <circle cx="310" cy="170" r="24" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="310" y="176" fill="#ffffff" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">3</text>
    <text x="360" y="150" fill="#a7f3d0" font-family="sans-serif" font-size="10" font-weight="bold">Step 5 (Print 3)</text>

    <!-- Node 4 -->
    <circle cx="60" cy="270" r="22" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="60" y="276" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">4</text>
    <text x="60" y="308" fill="#e9d5ff" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Step 3 (Print 4)</text>

    <!-- Node 5 -->
    <circle cx="160" cy="270" r="22" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="160" y="276" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">5</text>
    <text x="160" y="308" fill="#e9d5ff" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Step 4 (Print 5)</text>

    <!-- Tree Branches -->
    <line x1="190" y1="88" x2="130" y2="152" stroke="#64748b" stroke-width="1.8"/>
    <line x1="230" y1="88" x2="290" y2="152" stroke="#64748b" stroke-width="1.8"/>
    <line x1="95" y1="190" x2="72" y2="250" stroke="#64748b" stroke-width="1.8"/>
    <line x1="125" y1="190" x2="148" y2="250" stroke="#64748b" stroke-width="1.8"/>

    <!-- Call & Return Arrows (Curved Path Visual) -->
    <path d="M 185 75 Q 120 100 110 145" fill="none" stroke="#ec4899" stroke-width="2" marker-end="url(#arrowMagenta)"/>
    <path d="M 88 175 Q 55 200 60 245" fill="none" stroke="#ec4899" stroke-width="2" marker-end="url(#arrowMagenta)"/>
    <path d="M 78 255 Q 95 215 105 195" fill="none" stroke="#06b6d4" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arrowCyan)"/>
    <path d="M 125 185 Q 150 215 158 245" fill="none" stroke="#ec4899" stroke-width="2" marker-end="url(#arrowMagenta)"/>
    <path d="M 160 250 Q 145 205 125 175" fill="none" stroke="#06b6d4" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arrowCyan)"/>
    <path d="M 132 160 Q 165 110 195 85" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrowCyan)"/>
    <path d="M 230 75 Q 285 105 305 145" fill="none" stroke="#ec4899" stroke-width="2" marker-end="url(#arrowMagenta)"/>

    <!-- Legend at bottom left -->
    <rect x="20" y="340" width="380" height="65" rx="8" fill="#0f172a" stroke="#334155"/>
    <line x1="35" y1="360" x2="65" y2="360" stroke="#ec4899" stroke-width="2.5"/>
    <text x="75" y="364" fill="#fbcfe8" font-family="sans-serif" font-size="11" font-weight="bold">Pink Solid: Forward Recursive Call (Going Down)</text>
    <line x1="35" y1="385" x2="65" y2="385" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="75" y="389" fill="#a5f3fc" font-family="sans-serif" font-size="11" font-weight="bold">Cyan Dashed: Return to Caller Frame (Backtracking)</text>
  </g>

  <!-- Right: Call Stack & Subtree Delegation Trace -->
  <g transform="translate(485, 90)">
    <rect x="0" y="0" width="420" height="420" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
    <text x="210" y="28" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      Subtree Delegation Call Tree
    </text>

    <!-- Subtree Hierarchy Tree Box -->
    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="380" height="195" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="18" y="28" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">solve(1) [Root: 1]</text>
      <text x="35" y="55" fill="#f472b6" font-family="monospace" font-size="11.5">├── solve(2) [Left of 1]</text>
      <text x="55" y="82" fill="#c084fc" font-family="monospace" font-size="11">│    ├── solve(4) ➔ prints 4, returns</text>
      <text x="55" y="106" fill="#c084fc" font-family="monospace" font-size="11">│    └── solve(5) ➔ prints 5, returns</text>
      <text x="35" y="130" fill="#38bdf8" font-family="monospace" font-size="11.5">│    └── Left Subtree Complete! ➔ Returns to 1</text>
      <text x="35" y="158" fill="#34d399" font-family="monospace" font-size="11.5">└── solve(3) [Right of 1]</text>
      <text x="55" y="180" fill="#a7f3d0" font-family="monospace" font-size="11">     └── prints 3, returns ➔ DONE!</text>
    </g>

    <!-- Preorder Output Accumulator Ribbon -->
    <rect x="20" y="255" width="380" height="60" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="35" y="278" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="bold">OUTPUT ACCUMULATION SEQUENCE:</text>
    <text x="35" y="302" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="bold">
      [ 1 ] ➔ [ 2 ] ➔ [ 4 ] ➔ [ 5 ] ➔ [ 3 ]
    </text>

    <!-- Golden Insight Callout at Bottom -->
    <rect x="20" y="330" width="380" height="75" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="35" y="352" fill="#5eead4" font-family="sans-serif" font-size="11.5" font-weight="bold">💡 The Golden Rule of Tree Recursion:</text>
    <text x="35" y="372" fill="#e2e8f0" font-family="sans-serif" font-size="11">
      When node 4 finishes, we do NOT jump to 3.
    </text>
    <text x="35" y="390" fill="#fde047" font-family="sans-serif" font-size="11" font-weight="bold">
      We backtrack up to node 2, which then explores node 5!
    </text>
  </g>
</svg>
