  <!-- Background -->
  <rect width="940" height="520" rx="16" fill="url(#bgGrad7)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="470" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    🧠 Memory Architecture: Array vs. Linked List
  </text>
  <text x="470" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">
    Contiguous Physical Memory Layout (O(1) Access) vs. Scattered Heap Node Pointers (O(1) Insertion/Deletion)
  </text>

  <!-- Section 1: Array Contiguous Memory -->
  <rect x="40" y="85" width="860" height="185" rx="12" fill="#0ea5e912" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="65" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">
    1️⃣ ARRAY: CONTIGUOUS PHYSICAL MEMORY BLOCK (Index-Based O(1) Access)
  </text>

  <!-- Array cells -->
  <!-- arr[0] -->
  <rect x="65" y="135" width="150" height="75" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1.2" filter="url(#shadow7)"/>
