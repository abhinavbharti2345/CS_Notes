  <text x="612" y="372" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399">Node (0x12C0)</text>
  <rect x="550" y="380" width="60" height="35" rx="4" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="580" y="402" text-anchor="middle" font-family="monospace" font-size="11" fill="#f8fafc">30</text>
  <rect x="615" y="380" width="60" height="35" rx="4" fill="#111827" stroke="#334155" stroke-width="1"/>
