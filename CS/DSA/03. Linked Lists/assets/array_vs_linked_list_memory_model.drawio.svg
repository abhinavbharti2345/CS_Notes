  <text x="635" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">arr[3]</text>
  <text x="635" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f8fafc">Value: 40</text>
  <text x="635" y="200" text-anchor="middle" font-family="monospace" font-size="10" fill="#CBD5E1">Addr: 0x100C</text>

  <!-- Math box -->
  <rect x="725" y="135" width="160" height="75" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="805" y="158" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Offset Formula</text>
  <text x="805" y="178" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#cbd5e1">Base + (i × Size)</text>
  <text x="805" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">Lookup: O(1) ⚡</text>

  <text x="65" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#f43f5e">
    ⚠️ Shift Penalty: Inserting/deleting in the middle requires shifting all right elements ➔ O(N) penalty!
  </text>

  <!-- Section 2: Linked List Scattered Heap -->
  <rect x="40" y="295" width="860" height="200" rx="12" fill="#10b98112" stroke="#10b981" stroke-width="1.5"/>
