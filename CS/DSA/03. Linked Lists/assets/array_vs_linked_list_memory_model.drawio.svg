  <rect x="395" y="135" width="150" height="75" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1.2" filter="url(#shadow7)"/>
  <text x="470" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">arr[2]</text>
  <text x="470" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f8fafc">Value: 30</text>
  <text x="470" y="200" text-anchor="middle" font-family="monospace" font-size="10" fill="#CBD5E1">Addr: 0x1008</text>

