  <text x="140" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f8fafc">Value: 10</text>
  <text x="140" y="200" text-anchor="middle" font-family="monospace" font-size="10" fill="#CBD5E1">Addr: 0x1000</text>

  <!-- arr[1] -->
  <rect x="230" y="135" width="150" height="75" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1.2" filter="url(#shadow7)"/>
  <text x="305" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">arr[1]</text>
  <text x="305" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f8fafc">Value: 20</text>
  <text x="305" y="200" text-anchor="middle" font-family="monospace" font-size="10" fill="#CBD5E1">Addr: 0x1004</text>

