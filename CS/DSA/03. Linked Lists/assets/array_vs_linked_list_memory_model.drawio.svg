  <!-- LL Benefits Box -->
  <rect x="710" y="350" width="175" height="95" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="797" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">Dynamic Linking</text>
  <text x="797" y="398" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">Insert/Delete: O(1) ⚡</text>
  <text x="797" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#CBD5E1">Traversal: O(N)</text>

  <text x="65" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#6ee7b7">
