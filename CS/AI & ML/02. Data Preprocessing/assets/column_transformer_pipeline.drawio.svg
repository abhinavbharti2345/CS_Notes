<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F14" />
      <stop offset="100%" stop-color="#0B0F14" />
    </linearGradient>
    <filter id="shadow6" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrCyan6" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="arrAmber6" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b" />
    </marker>
    <marker id="arrPurple6" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c084fc" />
    </marker>
    <marker id="arrGreen6" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" rx="16" fill="url(#bgGrad6)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="470" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    🔀 Scikit-Learn ColumnTransformer Architecture
  </text>
  <text x="470" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">
    Heterogeneous Feature Dispatching ➔ Parallel Sub-Pipelines ➔ Column Concatenation ➔ Final Estimator
  </text>

  <!-- Raw Heterogeneous Input Data -->
  <rect x="40" y="160" width="160" height="200" rx="10" fill="#111827" stroke="#64748b" stroke-width="1.5" filter="url(#shadow6)"/>
  <text x="120" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">🗄️ Raw Dataset</text>
  <text x="120" y="215" text-anchor="middle" font-family="monospace" font-size="11" fill="#CBD5E1">X_train Matrix</text>
  
  <rect x="55" y="235" width="130" height="50" rx="6" fill="#0ea5e918" stroke="#0ea5e9" stroke-width="1"/>
  <text x="120" y="255" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8">Numerical Cols</text>
  <text x="120" y="272" text-anchor="middle" font-family="monospace" font-size="10" fill="#cbd5e1">[age, income]</text>

  <rect x="55" y="295" width="130" height="50" rx="6" fill="#f59e0b18" stroke="#f59e0b" stroke-width="1"/>
  <text x="120" y="315" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#fbbf24">Categorical Cols</text>
  <text x="120" y="332" text-anchor="middle" font-family="monospace" font-size="10" fill="#cbd5e1">[city, tier]</text>

  <!-- Split Branch 1: Numerical Sub-Pipeline -->
  <path d="M 200 260 L 255 170" stroke="#0ea5e9" stroke-width="2.2" marker-end="url(#arrCyan6)"/>
  <rect x="260" y="100" width="310" height="135" rx="10" fill="#0ea5e912" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow6)"/>
  <text x="415" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">
    🔢 Numerical Sub-Pipeline ('num')
  </text>
  
  <rect x="280" y="145" width="125" height="70" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
  <text x="342" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">SimpleImputer</text>
  <text x="342" y="195" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#cbd5e1">strategy='median'</text>

  <path d="M 405 180 L 430 180" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan6)"/>

  <rect x="435" y="145" width="115" height="70" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
  <text x="492" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">StandardScaler</text>
  <text x="492" y="195" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#cbd5e1">μ=0, σ=1</text>

  <!-- Split Branch 2: Categorical Sub-Pipeline -->
  <path d="M 200 320 L 255 355" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrAmber6)"/>
  <rect x="260" y="285" width="310" height="135" rx="10" fill="#f59e0b12" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow6)"/>
  <text x="415" y="313" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">
    🏷️ Categorical Sub-Pipeline ('cat')
  </text>
  
  <rect x="280" y="330" width="125" height="70" rx="6" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
  <text x="342" y="357" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">SimpleImputer</text>
  <text x="342" y="380" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#cbd5e1">fill='Unknown'</text>

  <path d="M 405 365 L 430 365" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrAmber6)"/>

  <rect x="435" y="330" width="115" height="70" rx="6" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
  <text x="492" y="357" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">OneHotEncoder</text>
  <text x="492" y="380" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#cbd5e1">drop='first'</text>

  <!-- Join Stage: Feature Concatenation -->
  <path d="M 570 170 L 625 240" stroke="#0ea5e9" stroke-width="2.2" marker-end="url(#arrPurple6)"/>
  <path d="M 570 355 L 625 280" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrPurple6)"/>

  <rect x="630" y="210" width="120" height="100" rx="8" fill="#111827" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow6)"/>
  <text x="690" y="245" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c084fc">🔗 Feature</text>
  <text x="690" y="265" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c084fc">Matrix Merge</text>
  <text x="690" y="290" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#CBD5E1">np.hstack()</text>

  <!-- Final Estimator Stage -->
  <path d="M 750 260 L 785 260" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrGreen6)"/>

  <rect x="790" y="195" width="120" height="130" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.8" filter="url(#shadow6)"/>
  <text x="850" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">🧠 Estimator</text>
  <text x="850" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">LinearRegression</text>
  <text x="850" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#cbd5e1">or Ridge / RF</text>
  <text x="850" y="305" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#6ee7b7">Output: ŷ</text>

  <!-- DrawIO metadata script -->
  <script type="application/xml">
    <mxfile host="Electron" modified="2026-10-06T11:00:00.000Z" agent="Antigravity" version="21.6.8" type="device">
      <diagram id="col-trans" name="ColumnTransformer Pipeline">
        <mxGraphModel dx="1000" dy="600" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="940" pageHeight="500" background="#0f172a">
          <root>
            <mxCell id="0"/>
            <mxCell id="1" parent="0"/>
          </root>
        </mxGraphModel>
      </diagram>
    </mxfile>
  </script>
</svg>
