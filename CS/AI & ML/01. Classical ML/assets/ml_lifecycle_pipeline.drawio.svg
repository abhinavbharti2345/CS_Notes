<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F14" />
      <stop offset="100%" stop-color="#0B0F14" />
    </linearGradient>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrCyan5" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="arrPurple5" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c084fc" />
    </marker>
    <marker id="arrGreen5" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399" />
    </marker>
    <marker id="arrAmber5" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="16" fill="url(#bgGrad5)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    🔁 End-to-End Machine Learning Production Lifecycle
  </text>
  <text x="480" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">
    Standardized, leak-proof 10-stage workflow from raw data ingestion to production monitoring &amp; feedback loops
  </text>

  <!-- Row 1: Stage 1 to 5 -->
  <!-- Phase 1: Data Ingestion & Understanding -->
  <rect x="35" y="85" width="435" height="185" rx="10" fill="#0ea5e910" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="50" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">
    PHASE 1: INGESTION &amp; EDA
  </text>

  <!-- S1 -->
  <rect x="50" y="125" width="120" height="130" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1.2" filter="url(#shadow5)"/>
  <text x="110" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">1. Ingestion</text>
  <text x="110" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">SQL, CSV, APIs,</text>
  <text x="110" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Kafka Streams</text>
  <text x="110" y="225" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#CBD5E1">Raw Data</text>

  <path d="M 170 190 L 185 190" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan5)"/>

  <!-- S2 -->
  <rect x="190" y="125" width="130" height="130" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1.2" filter="url(#shadow5)"/>
  <text x="255" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">2. EDA &amp; Inspect</text>
  <text x="255" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Distributions,</text>
  <text x="255" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Correlations,</text>
  <text x="255" y="206" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Skewness &amp; Outliers</text>

  <path d="M 320 190 L 335 190" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan5)"/>

  <!-- S3 -->
  <rect x="340" y="125" width="115" height="130" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1.2" filter="url(#shadow5)"/>
  <text x="397" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">3. Cleaning</text>
  <text x="397" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Deduplication,</text>
  <text x="397" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Fix invalid data,</text>
  <text x="397" y="206" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Missing policy</text>

  <!-- Transition Phase 1 to Phase 2 -->
  <path d="M 470 190 L 490 190" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrPurple5)"/>

  <!-- Phase 2: Partition & Preprocess -->
  <rect x="495" y="85" width="430" height="185" rx="10" fill="#8b5cf610" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="510" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#c084fc">
    PHASE 2: ISOLATION &amp; PREPROCESSING (ZERO LEAKAGE)
  </text>

  <!-- S4 -->
  <rect x="510" y="125" width="190" height="130" rx="6" fill="#111827" stroke="#c084fc" stroke-width="1.2" filter="url(#shadow5)"/>
  <text x="605" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#c084fc">4. Train / Test Split</text>
  <text x="605" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Partition 80% / 20%</text>
  <text x="605" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Lock Test Set 🔒</text>
  <text x="605" y="215" text-anchor="middle" font-family="monospace" font-size="9" fill="#f43f5e">SPLIT BEFORE FIT</text>

  <path d="M 700 190 L 720 190" stroke="#c084fc" stroke-width="2" marker-end="url(#arrPurple5)"/>

  <!-- S5 -->
  <rect x="725" y="125" width="185" height="130" rx="6" fill="#111827" stroke="#c084fc" stroke-width="1.2" filter="url(#shadow5)"/>
  <text x="817" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#c084fc">5. Feature Pipeline</text>
  <text x="817" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">StandardScaler</text>
  <text x="817" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">OneHotEncoder</text>
  <text x="817" y="215" text-anchor="middle" font-family="monospace" font-size="9" fill="#34d399">fit_transform(Train)</text>

  <!-- Connecting Path Downward to Row 2 -->
  <path d="M 817 270 L 817 305" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrGreen5)"/>

  <!-- Phase 3: Model Modeling & Evaluation -->
  <rect x="35" y="305" width="460" height="185" rx="10" fill="#10b98110" stroke="#10b981" stroke-width="1.2"/>
  <text x="50" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">
    PHASE 3: TRAINING &amp; GENERALIZATION EVALUATION
  </text>

  <!-- S6 & S7 -->
  <rect x="50" y="345" width="135" height="130" rx="6" fill="#111827" stroke="#34d399" stroke-width="1.2" filter="url(#shadow5)"/>
  <text x="117" y="368" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">6/7. Fit Model</text>
  <text x="117" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Select Estimator</text>
  <text x="117" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Optimize loss</text>
  <text x="117" y="435" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#6ee7b7">model.fit(X_tr)</text>

  <path d="M 185 410 L 205 410" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen5)"/>

  <!-- S8 -->
  <rect x="210" y="345" width="135" height="130" rx="6" fill="#111827" stroke="#34d399" stroke-width="1.2" filter="url(#shadow5)"/>
  <text x="277" y="368" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">8. Test Predict</text>
  <text x="277" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Unseen X_test</text>
  <text x="277" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">transform() only</text>
  <text x="277" y="435" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#7dd3fc">ŷ = predict(X_te)</text>

  <path d="M 345 410 L 365 410" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen5)"/>

  <!-- S9 -->
  <rect x="370" y="345" width="110" height="130" rx="6" fill="#111827" stroke="#34d399" stroke-width="1.2" filter="url(#shadow5)"/>
  <text x="425" y="368" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">9. Metrics</text>
  <text x="425" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">RMSE, MAE,</text>
  <text x="425" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">R², F1-Score</text>
  <text x="425" y="435" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#fcd34d">Validate</text>

  <!-- Transition Phase 3 to Phase 4 -->
  <path d="M 495 410 L 515 410" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrAmber5)"/>

  <!-- Phase 4: Production & Monitoring -->
  <rect x="520" y="305" width="405" height="185" rx="10" fill="#f59e0b10" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="535" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">
    PHASE 4: SERVING, MONITORING &amp; FEEDBACK
  </text>

  <!-- S10 Production -->
  <rect x="535" y="345" width="180" height="130" rx="6" fill="#111827" stroke="#fbbf24" stroke-width="1.2" filter="url(#shadow5)"/>
  <text x="625" y="368" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">10. Deploy &amp; Serve</text>
  <text x="625" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">FastAPI / REST API</text>
  <text x="625" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Docker Container</text>
  <text x="625" y="435" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#38bdf8">Live Inference</text>

  <path d="M 715 410 L 735 410" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrAmber5)"/>

  <!-- S10 Drift & Feedback -->
  <rect x="740" y="345" width="170" height="130" rx="6" fill="#111827" stroke="#fbbf24" stroke-width="1.2" filter="url(#shadow5)"/>
  <text x="825" y="368" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Drift &amp; Retrain</text>
  <text x="825" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Data Drift Detect</text>
  <text x="825" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Concept Drift Detect</text>
  <text x="825" y="435" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#f43f5e">Trigger Retrain 🔁</text>

  <!-- DrawIO metadata script -->
  <script type="application/xml">
    <mxfile host="Electron" modified="2026-10-06T11:00:00.000Z" agent="Antigravity" version="21.6.8" type="device">
      <diagram id="ml-lifecycle" name="ML Lifecycle Pipeline">
        <mxGraphModel dx="1000" dy="600" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="960" pageHeight="520" background="#0f172a">
          <root>
            <mxCell id="0"/>
            <mxCell id="1" parent="0"/>
          </root>
        </mxGraphModel>
      </diagram>
    </mxfile>
  </script>
</svg>
