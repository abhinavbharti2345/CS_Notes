<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F14" />
      <stop offset="100%" stop-color="#0A0A0F" />
    </linearGradient>
    <filter id="glowOrange" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FB923C" flood-opacity="0.15"/>
    </filter>
    <marker id="arrOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FB923C" />
    </marker>
    <marker id="arrCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38BDF8" />
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34D399" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="500" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Title -->
  <text x="470" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">
    ⚡ High-Throughput Caching &amp; Event Streaming Architecture
  </text>
  <text x="470" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">
    Read-acceleration caching patterns (Redis) decoupled from asynchronous event queues (Kafka / RabbitMQ)
  </text>

  <!-- Caching Patterns Container -->
  <rect x="40" y="85" width="410" height="380" rx="10" fill="#111827" stroke="#FB923C" stroke-width="1.8" filter="url(#glowOrange)"/>
  <text x="60" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FB923C">
    1. CORE CACHING STRATEGIES (REDIS)
  </text>

  <!-- Pattern 1: Cache-Aside -->
  <rect x="55" y="130" width="380" height="72" rx="8" fill="#0B0F14" stroke="#FB923C" stroke-width="1.2"/>
  <text x="70" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Cache-Aside (Lazy Loading)</text>
  <text x="70" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#CBD5E1">1. App checks Cache → 2. On miss, query Database</text>
  <text x="70" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38BDF8">3. App populates Cache with DB result</text>

  <!-- Pattern 2: Write-Through -->
  <rect x="55" y="212" width="380" height="72" rx="8" fill="#0B0F14" stroke="#FB923C" stroke-width="1.2"/>
  <text x="70" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Write-Through</text>
  <text x="70" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#CBD5E1">App writes to Cache → Cache synchronously writes to DB</text>
  <text x="70" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34D399">Ensures zero stale cache; higher write latency</text>

  <!-- Pattern 3: Write-Behind (Write-Back) -->
  <rect x="55" y="294" width="380" height="72" rx="8" fill="#0B0F14" stroke="#FB923C" stroke-width="1.2"/>
  <text x="70" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Write-Behind (Write-Back)</text>
  <text x="70" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#CBD5E1">App writes to Cache immediately → Cache batches async writes to DB</text>
  <text x="70" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#FACC15">Ultra-fast writes; risk of data loss on crash</text>

  <!-- Pattern 4: Refresh-Ahead -->
  <rect x="55" y="376" width="380" height="72" rx="8" fill="#0B0F14" stroke="#FB923C" stroke-width="1.2"/>
  <text x="70" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Refresh-Ahead</text>
  <text x="70" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#CBD5E1">Cache automatically refreshes hot keys before TTL expiration</text>
  <text x="70" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38BDF8">Eliminates cold-cache latency spikes for hot read keys</text>

  <!-- Event Queues Container -->
  <rect x="490" y="85" width="410" height="380" rx="10" fill="#111827" stroke="#38BDF8" stroke-width="1.8" filter="url(#glowOrange)"/>
  <text x="510" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38BDF8">
    2. ASYNCHRONOUS EVENT STREAMING (KAFKA)
  </text>

  <!-- Producer Box -->
  <rect x="510" y="140" width="100" height="60" rx="8" fill="#0B0F14" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="560" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Producer</text>
  <text x="560" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#CBD5E1">API Servers</text>

  <!-- Arrow to Kafka -->
  <path d="M 610 170 L 645 170" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrCyan)"/>

  <!-- Kafka Broker Box -->
  <rect x="650" y="130" width="230" height="150" rx="8" fill="#0B0F14" stroke="#FACC15" stroke-width="1.5"/>
  <text x="765" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FACC15">Apache Kafka Cluster</text>

  <rect x="665" y="165" width="200" height="30" rx="4" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="765" y="184" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#38BDF8">Topic: orders-event [P0 | P1 | P2]</text>

  <rect x="665" y="202" width="200" height="30" rx="4" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="765" y="221" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#34D399">Persistent Append-Only Disk Log</text>

  <rect x="665" y="238" width="200" height="30" rx="4" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="765" y="257" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#CBD5E1">Zero-Copy DMA Transfer (OS page cache)</text>

  <!-- Arrow to Consumers -->
  <path d="M 765 280 L 765 315" stroke="#34D399" stroke-width="2" marker-end="url(#arrGreen)"/>

  <!-- Consumer Group Box -->
  <rect x="510" y="325" width="370" height="120" rx="8" fill="#0B0F14" stroke="#34D399" stroke-width="1.2"/>
  <text x="695" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#34D399">Consumer Groups (Offset Tracked)</text>

  <rect x="525" y="362" width="105" height="65" rx="6" fill="#111827" stroke="#34D399" stroke-width="1"/>
  <text x="577" y="388" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">Payment</text>
  <text x="577" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">Service</text>

  <rect x="645" y="362" width="105" height="65" rx="6" fill="#111827" stroke="#34D399" stroke-width="1"/>
  <text x="697" y="388" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">Notification</text>
  <text x="697" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">Email / SMS</text>

  <rect x="765" y="362" width="100" height="65" rx="6" fill="#111827" stroke="#34D399" stroke-width="1"/>
  <text x="815" y="388" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">Analytics</text>
  <text x="815" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">ClickHouse</text>
</svg>